name: CI

# Build and verify every release target on PRs, including toolchain updates.
on:
  pull_request:
  push:
    branches: [main]
  # Re-dispatched by sync-bun-nix.yml after it pushes a regenerated bun.nix to
  # a Dependabot branch (GITHUB_TOKEN pushes don't trigger workflows on their
  # own, and a required check must land on the synced head commit).
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded runs on the same ref — stale PR checks are worthless.
# Scope the group by event too so a workflow_dispatch re-run (the sync-bun-nix
# re-dispatch) never cancels, or is cancelled by, an unrelated push/PR run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# `shell: bash` (vs the unspecified default) adds -o pipefail.
defaults:
  run:
    shell: bash

# Third-party actions are pinned to commit SHAs (the trailing comment is the
# tag): a tag can be force-moved to malicious code, a SHA can't.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false # nothing here pushes

      - uses: ./.github/actions/setup-toolchain

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint + format check
        run: biome check .

      # Exercise release retries and the registry visibility deadline without
      # publishing. Explicit paths: default discovery does not include .mjs.
      - name: Tests
        run: |
          bun test
          bun test scripts/wait-for-npm-packages.test.mjs

      # Exercise the same complete builder used by Pages at both supported URL
      # shapes.
      - name: Check website builds
        run: |
          for site_base in /r3 ""; do
            R3_SITE_BASE="$site_base" R3_SITE_URL="https://example.test$site_base" bun site/build.ts
            test -s dist/pages/index.html
            test -s dist/pages/404.html
          done

      - name: Build all release targets
        run: bun scripts/release-binaries.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-binaries
          path: dist/r3-*
          if-no-files-found: error
          retention-days: 7

  binaries:
    needs: build
    uses: ./.github/workflows/verify-binaries.yml
    with:
      sign: true

  nix:
    name: Nix ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: macos-15, platform: darwin-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Verify Nix toolchain versions
        run: nix shell .#bun .#biome .#node .#npm --command bun scripts/check-toolchain.ts
      - name: Build and verify the Nix package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          nix build .#r3
          nix shell .#bun --command bun scripts/verify-binary.ts result/bin/r3 "$PLATFORM"

  # Keep the existing required status name; it covers every native/Nix check.
  check:
    if: always()
    needs: [build, binaries, nix]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
