name: Verify built binaries

on:
  workflow_call:
    inputs:
      sign:
        description: Sign fresh macOS builds; immutable reused release assets are only verified.
        type: boolean
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: r3-binaries
          path: dist
      - name: Sign fresh macOS binaries
        if: inputs.sign && runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: codesign --force --sign - "dist/r3-$PLATFORM"
      - name: Verify the native binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bun scripts/verify-binary.ts "dist/r3-$PLATFORM" "$PLATFORM"
      # Only these verified (and, for fresh macOS builds, signed) bytes may ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-verified-${{ matrix.platform }}
          path: dist/r3-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
