name: Deploy website to Pages

# Publish the static website and frontend-only demo as one Pages artifact.
# site/build.ts owns the complete build when present. Until it lands, preserve
# the existing demo deployment (in-memory state and a scripted agent).
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    # Include the website, demo, and the product sources used to generate docs
    # and fixtures. Deployment must follow content changes as well as UI changes.
    paths:
      - site/**
      - web/**
      - shared/**
      - server/**
      - cli/**
      - docs/**
      - scripts/**
      - README.md
      - bunfig.toml
      - bun.lock
      - package.json
      - tsconfig.json
      - toolchain/**
      - .github/actions/setup-toolchain/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

# Least privilege: read the repo, plus the Pages deploy tokens (id-token is the
# OIDC handshake the deploy uses to prove it's this workflow).
permissions:
  contents: read
  pages: write
  id-token: write

# One live site at a time — but never cancel an in-flight publish (a half-deployed
# Pages site is worse than a slightly stale one).
concurrency:
  group: pages
  cancel-in-progress: false

# `shell: bash` (vs the unspecified default) adds -o pipefail.
defaults:
  run:
    shell: bash

# Third-party actions are pinned to commit SHAs (the trailing comment is the tag):
# a tag can be force-moved to malicious code, a SHA can't. Matches CI's pins.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Retained for the demo-only fallback. The website builder owns its demo
    # integration and derives paths from R3_SITE_BASE.
    env:
      DEMO_SUBDIR: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes

      # Pin Bun to the dev-shell version so the demo bundles identically to local.
      - uses: ./.github/actions/setup-toolchain

      - run: bun install --frozen-lockfile

      # Supplies both project-page paths and custom-domain origins.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Pages site
        env:
          R3_SITE_BASE: ${{ steps.pages.outputs.base_path }}
          R3_SITE_URL: ${{ steps.pages.outputs.base_url }}
          R3_DEMO_BASE: ${{ steps.pages.outputs.base_path }}/${{ env.DEMO_SUBDIR }}
          R3_DEMO_SUBDIR: ${{ env.DEMO_SUBDIR }}
        run: |
          if [ -f site/build.ts ]; then
            bun site/build.ts
          else
            bun run gen:demo
            bun run build:demo
            bun run stage:pages
          fi
          test -s dist/pages/index.html
          test -s dist/pages/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
