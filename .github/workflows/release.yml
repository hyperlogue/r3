name: Release

# Tag-driven release, gated on a human approval. Pushing a `v<version>` tag runs:
#
#   verify            — the tag's shape and the version lockstep, in seconds,
#                       before a runner spends half an hour cross-compiling.
#   build             — the four native binaries (or, on a re-run, the exact
#                       bytes already attached to this tag's release), handed to
#                       native verification as an artifact. Holds no write
#                       permission and no publish credential.
#   binaries          — sign fresh macOS outputs and verify all four targets on
#                       native runners, then upload the exact bytes to publish.
#   publish           — the GitHub Release, four per-platform npm packages, then
#                       the launcher after every exact platform pin is visible.
#
# "Re-run failed jobs" repeats the single publish job. An existing GitHub Release
# is left untouched, and npm versions already on the registry are skipped. npm
# packages always use the published release assets, including on the first run.
#
# Check for the release before downloading the build artifact, so an npm retry
# works even after that artifact expires. Never re-upload immutable assets.
#
# `environment: release` gates the single publish job, providing one approval and
# the environment claim npm's trusted publisher requires. Jobs that run
# unattended on a tag push can only read. Binaries are built and verified
# before approval is requested.
#
# Three version sources must agree exactly: the git tag, npm/package.json, and
# shared/version.ts. stage-npm-packages.ts stamps the launcher's per-platform
# pins from that one version, and two guards enforce the rest transitively (see
# below); a release dies in <1 min on drift, before anything is built.
on:
  push:
    tags: ['v*']

# Least privilege by default. `publish` is the only job with `contents: write`.
# It also holds `id-token: write` (npm's OIDC identity), behind the approval gate.
permissions:
  contents: read

# Never cancel a half-finished publish — queue instead. (This also holds a run
# parked on the approval gate: an approval that arrives late still publishes the
# tag it was asked about.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `shell: bash` (vs the unspecified default) adds -o pipefail.
defaults:
  run:
    shell: bash

# npm auth is TRUSTED PUBLISHING (OIDC) — there is no npm token anywhere in this
# repo's secrets. npm mints a short-lived, publish-only credential from the
# runner's OIDC identity, scoped to (org, repo, workflow filename). Consequences
# to respect when editing this file:
#
#   - RENAMING THIS FILE BREAKS PUBLISHING. Each of the five packages
#     (@hyperlogue/r3 + the four @hyperlogue/r3-<os>-<arch>) registers
#     `release.yml` by name on npmjs.com → Settings → Trusted Publisher. Rename
#     it and every publish 404s until all five registrations are updated.
#   - Publishing from another workflow, a fork, or a self-hosted runner won't
#     work — that's the point. (Publishing from another *job* of this file is
#     fine: the claim names the workflow, not the job.)
#   - Each package's trusted publisher names the `release` environment. The
#     OIDC token carries that claim only when the job sets
#     `environment: release`, so the publish job does. Removing it fails
#     `npm publish` and removes the approval gate.
#   - A brand-new package name (say, adding a windows target) has no trusted
#     publisher yet, so its FIRST publish must be done by hand from a laptop;
#     then register `release.yml` on it before the next release.
#
# Third-party actions are pinned to commit SHAs (the trailing comment is the
# tag): a tag can be force-moved to malicious code, a SHA can't — and this
# workflow can publish to npm.
#
# No `run:` block below interpolates a `${{ }}` expression into its script body.
# Expressions are substituted into the script *text* before bash parses it, so a
# value carrying `$( )`, a backtick, or `;` would become code. Values reach
# scripts through `env:` instead, where bash treats them as data.
jobs:
  # Gate the whole release on the tag before a build runner starts.
  #
  # (1) SHAPE. `github.ref_name` flows on into shell scripts and release titles,
  #     and git accepts `$( )`, backticks, quotes, `;`, `&` and `|` in a ref name
  #     (only space and `*` are rejected) — so an unvalidated tag is a
  #     script-injection vector. Pinning it to plain SemVer kills the class at the
  #     source; the env indirection everywhere downstream is the second layer.
  # (2) VERSION. tag ↔ npm/package.json. Combined with release-binaries.ts's own
  #     npm ↔ shared/version.ts check, this transitively pins all three sources.
  #     We never auto-fix here — the tag is the human's assertion; drift means a
  #     mistake, so fail and make them re-tag.
  # (3) NOTES. The changelog section is only WARNED about, not enforced: it
  #     degrades to --generate-notes below rather than shipping wrong notes, and a
  #     prerelease tag (v1.0.0-rc.1) legitimately has no section of its own.
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes

      - name: Verify the tag shape and the version lockstep
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a plain SemVer v-tag (vMAJOR.MINOR.PATCH[-prerelease]). Delete it and re-tag."
            exit 1
          fi

          PKG_V=$(jq -r .version npm/package.json)
          if [ "$GITHUB_REF_NAME" != "v$PKG_V" ]; then
            echo "::error::tag $GITHUB_REF_NAME != npm/package.json v$PKG_V — fix versions, delete the tag, re-tag."
            exit 1
          fi

          grep -qF "## [$PKG_V]" CHANGELOG.md ||
            echo "::warning::no '## [$PKG_V]' section in CHANGELOG.md — the release will fall back to auto-generated notes."

          echo "version=$PKG_V" >> "$GITHUB_OUTPUT"
          echo "verified $GITHUB_REF_NAME against npm/package.json v$PKG_V"

  build:
    name: build binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      reused: ${{ steps.binaries.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes

      - uses: ./.github/actions/setup-toolchain

      - run: bun install --frozen-lockfile

      # A tag can land on an unchecked commit — cheap insurance.
      - name: Typecheck + lint
        run: |
          bun run typecheck
          biome check .

      # Cross-compiles all 4 targets into dist/ from this one runner (Bun
      # cross-compiles every platform; no OS matrix). Also re-checks
      # npm ↔ shared/version.ts and fails loudly on drift.
      #
      # On a RE-RUN where this tag's GitHub Release already carries the assets,
      # reuse those exact bytes instead of rebuilding: Bun builds aren't
      # guaranteed byte-identical, and a partial prior run may already have
      # published some npm packages, so a rebuild would drift the two channels.
      # That download is the one path where the bytes didn't come from this job,
      # so verify it against GitHub's own per-asset sha256 digests — which is why
      # we don't publish a checksum manifest of our own.
      - name: Build or reuse release binaries
        id: binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
             && gh release download "$GITHUB_REF_NAME" -D dist -p 'r3-*' --clobber \
             && test -f dist/r3-linux-x64 && test -f dist/r3-linux-arm64 \
             && test -f dist/r3-darwin-x64 && test -f dist/r3-darwin-arm64; then
            echo "Reusing binaries already attached to $GITHUB_REF_NAME."
            echo "reused=true" >> "$GITHUB_OUTPUT"
            # Only the r3-* assets — an older release may still carry a
            # SHA256SUMS we didn't download, and sha256sum -c fails on a missing
            # file. A release predating asset digests reports none: warn instead
            # of failing, rather than block a re-run on a check we can't run.
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '.assets[] | select(.digest) | select(.name | startswith("r3-"))
                    | "\(.digest | sub("^sha256:"; ""))  \(.name)"' > /tmp/digests
            if [ "$(grep -c . /tmp/digests)" -ge 4 ]; then
              (cd dist && sha256sum -c /tmp/digests)
            else
              echo "::warning::$GITHUB_REF_NAME exposes no asset digests — reusing the download unverified."
            fi
          else
            bun scripts/release-binaries.ts
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      # Native runners sign fresh macOS builds and verify every target before
      # handing their outputs to publication. Reused assets remain unchanged.
      # npm uses the published release assets, so a retry ships
      # the bytes the release page serves even if a later full rerun rebuilt.
      # The exec bit doesn't survive an artifact round-trip and doesn't need to —
      # release assets are plain bytes, and stage-npm-packages.ts chmods 0755 as
      # it stages.
      #
      # `retention-days` bounds how long the first approval may idle. Approve
      # within a week, or re-run the workflow (which rebuilds, or reuses whatever
      # the release already carries). Once that release exists, an npm retry does
      # not need this artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-binaries
          path: dist/r3-*
          if-no-files-found: error
          retention-days: 7

  binaries:
    needs: build
    uses: ./.github/workflows/verify-binaries.yml
    with:
      sign: ${{ needs.build.outputs.reused != 'true' }}

  publish:
    name: publish GitHub release and npm packages
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # THE APPROVAL GATE. All publication shares this environment, and a tag
    # push bypasses branch protection: without a gate, anyone with write access
    # (or any workflow holding contents:write) could tag an arbitrary commit
    # straight into a signed publish. Configure this environment in repo settings
    # with required reviewers, and add a tag ruleset on `v*`. GitHub creates the
    # environment implicitly if it doesn't exist yet, so the workflow still runs
    # — it just isn't gated until you configure it. The gate is per job.
    environment: release
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # npm trusted publishing (OIDC) + provenance attestation
    env:
      # The verified value, not the raw ref: the string is identical (verify
      # proved it) but sourcing it from the guard's output means an unvalidated
      # tag can't reach these scripts even if this file is edited later.
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing pushes via git

      # A retry must reach npm without downloading an expired build artifact or
      # attempting to overwrite immutable release assets. Only a 404 means absent;
      # authentication, network, and other API failures stop publication.
      - name: Check for an existing GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
              --include > "$RUNNER_TEMP/release-response"; then
            if ! sed '1,/^\r*$/d' "$RUNNER_TEMP/release-response" | jq -e '.draft == false' >/dev/null; then
              echo "::error::v$VERSION is not a published release. Complete or remove its draft before retrying."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already published — keeping its release and assets unchanged."
          elif grep -q '^HTTP/[^ ]* 404' "$RUNNER_TEMP/release-response"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check the GitHub Release; refusing to publish."
            exit 1
          fi

      # Only the per-platform outputs of native verification may ship. v8
      # verifies the artifact digests and fails on a mismatch.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.release.outputs.exists == 'false'
        with:
          pattern: r3-verified-*
          merge-multiple: true
          path: dist

      # Confirm the set is complete before anything outward-facing happens.
      # Native runners already verified them; this job only uploads bytes.
      - name: Check the downloaded binaries
        if: steps.release.outputs.exists == 'false'
        run: |
          binaries=(dist/r3-*)
          test "${#binaries[@]}" = 4
          ls -l dist

      # GitHub Release FIRST. The npm steps download these published assets,
      # including on retries, so npm ships the bytes the release page serves.
      # Prerelease tags (v*-*) are marked so they never become the repo's
      # "Latest". Globbed as `dist/r3-*` rather than `dist/*` so only the
      # intended asset kind is ever attached.
      #
      # The release description is this version's CHANGELOG.md section, read from
      # the tagged tree — so the release page matches the changelog verbatim
      # instead of a commit-derived summary, from the same single source the repo
      # already maintains (the tag needs no message body, and can't drift from the
      # changelog). Fall back to GitHub's --generate-notes only when that section
      # is missing or empty. An existing release and its assets stay untouched.
      - name: Create the GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          # Pull exactly this version's changelog section, minus its heading.
          awk -v v="$VERSION" \
            'index($0, "## [" v "]")==1 {f=1; next} /^## \[/{f=0} f' CHANGELOG.md |
            sed '/./,$!d' > "$RUNNER_TEMP/relnotes.md"
          NOTES=(--generate-notes)
          grep -q '[^[:space:]]' "$RUNNER_TEMP/relnotes.md" && NOTES=(--notes-file "$RUNNER_TEMP/relnotes.md")
          gh release create "v$VERSION" dist/r3-* --verify-tag \
            --title "v$VERSION" "${NOTES[@]}" "${PRERELEASE[@]}"

      # Canonical bytes from the GitHub Release, not the workflow artifact. A
      # full rerun may rebuild, and Bun builds aren't byte-identical; immutable
      # release assets are what a retry must publish.
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Clear build bytes first so an incomplete release cannot be filled in
          # silently by the workflow artifact downloaded earlier in this job.
          rm -f dist/r3-*
          gh release download "v$VERSION" -D dist -p 'r3-*' --clobber
          binaries=(dist/r3-*)
          test "${#binaries[@]}" = 4

      # Install only the locked toolchain, with lifecycle scripts disabled.
      # Staging uses builtins; application dependencies are not installed here.
      - uses: ./.github/actions/setup-toolchain

      # Stage the four per-platform npm packages (dist/npm/<pkg>/) from the
      # binaries and stamp the launcher's optionalDependencies pins to this
      # version — the single source of the launcher↔binary version lockstep.
      - name: Stage npm packages and launcher pins
        run: bun scripts/stage-npm-packages.ts

      # The binary ships 0755 in the tarball (npm preserves modes); a 0644 binary
      # would EACCES on every install, so verify the staged package kept the bit.
      # Stat only. Native runners already verified every target,
      # and running an unverified binary inside the job that can mint an npm
      # publish credential would let a poisoned artifact rewrite the other three
      # platform packages before they're published.
      - name: Check the staged packages
        run: |
          for d in dist/npm/*/; do
            test -x "$d/bin/r3"
            echo "  ok $d"
          done

      # setup-toolchain supplies the exact OIDC-capable npm pin. It omits
      # setup-node's registry-url so no token placeholder shadows OIDC.

      # Publish the four per-platform binary packages BEFORE the launcher: the
      # launcher's optionalDependencies pin them at this exact version, so a user
      # must never resolve a launcher whose platform package isn't on the registry
      # yet. Each publish is idempotent (skip if this version already exists) so a
      # re-run after a partial failure converges. --prefer-online so a stale local
      # cache can't hide a version that is already published. --provenance attests
      # the actual binary bytes, not just the launcher shim (trusted publishing is
      # documented to attach provenance on its own, but the flag is what we
      # actually verify, so keep it explicit).
      - name: Publish platform binary packages
        run: |
          for d in dist/npm/*/; do
            NAME=$(jq -r .name "$d/package.json")
            V=$(jq -r .version "$d/package.json")
            if [ -n "$(npm view "$NAME@$V" version --prefer-online 2>/dev/null || true)" ]; then
              echo "$NAME@$V already published — skipping (idempotent re-run)."
              continue
            fi
            ( cd "$d" && npm publish --provenance --access public )
          done

      # npm's read path can lag a successful publish by minutes. Wait until all
      # four platform packages are visible before publishing the launcher, so the
      # first post-release `npx` can't 404 on a platform dependency. One
      # ten-minute deadline covers every pin, the registry requests, and the
      # sleeps. A package still missing after that FAILS the job — publishing
      # the launcher anyway would ship exactly the broken resolve this step
      # exists to prevent. Re-run failed jobs once the registry catches up.
      - name: Wait for platform packages to be visible
        run: scripts/wait-for-npm-packages.sh

      # npm publish LAST (effectively irreversible), after its platform packages.
      # Skip if this exact version is already on npm, so a re-run after a transient
      # failure converges. Prerelease versions go to the `next` dist-tag so `latest`
      # never resolves an RC. --provenance (needs id-token: write) gives users a
      # verifiable build attestation — free for a public repo whose repository URL
      # already matches. Lifecycle scripts stay enabled: prepack copies the README
      # into the published package.
      - name: Publish npm launcher
        working-directory: npm
        run: |
          V=$(jq -r .version package.json)
          if [ -n "$(npm view "@hyperlogue/r3@$V" version --prefer-online 2>/dev/null || true)" ]; then
            echo "@hyperlogue/r3@$V already published — skipping (idempotent re-run)."
            exit 0
          fi
          TAG=latest
          [[ "$V" == *-* ]] && TAG=next
          npm publish --provenance --access public --tag "$TAG"
