# Dependabot keeps two supply chains from fossilizing:
#
#  - github-actions: the workflows pin actions to commit SHAs (a tag can be
#    force-moved to malicious code, a SHA can't) — Dependabot is the bump
#    mechanism that keeps those pins current. It updates the SHA and the
#    trailing `# vX.Y.Z` comment together. The Bun *runtime* pin in the
#    workflows (setup-bun's bun-version) is deliberately not automated: it must
#    move in lockstep with the dev shell (see the comment in ci.yml).
#
#  - bun: root package.json + bun.lock. CI installs with --frozen-lockfile, so
#    only a bun-aware updater that rewrites the lockfile keeps CI green.
#    Dependabot can't regenerate bun.nix (bun2nix's mirror of the lockfile —
#    it never runs the postinstall hook that does so locally), so
#    sync-bun-nix.yml regenerates it and pushes the fix onto Dependabot's PR
#    branches automatically.
#
# Deliberately NOT covered: npm/ — the launcher's optionalDependencies are
# exact-version pins stamped by the release pipeline (stage-npm-packages.ts);
# bumping them out-of-band would break the launcher↔binary version lockstep.
#
# Both ecosystems carry a `cooldown` (default-days: 21): Dependabot only opens a
# version-update PR for a release that's been public for at least 3 weeks, so a
# freshly-published compromised version can't reach a PR before it's had time to
# be caught. This mirrors the `minimumReleaseAge` in bunfig.toml, which applies
# the same 21-day policy to *manual* `bun install` / `bun update`. (Cooldown
# covers version updates only — Dependabot *security* updates deliberately
# bypass it so a real fix isn't held back.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 21
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 21
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # The bun.nix generator (exact-pinned wasm devDependency). Bumped by
      # hand together with the flake's bun2nix input (the consumer side:
      # fetchBunDeps + hook), so generator and consumer can't drift apart.
      - dependency-name: bun2nix
