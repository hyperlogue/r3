version: "0.5"
is_strict: true

processes:
  # The server bundles its guarded SPA at startup. Server edits restart it;
  # restart after frontend edits.
  # Application and previews share port 8891. Isolated, gitignored XDG directories
  # keep this instance separate from the normal server (default port 8791).
  # State, configuration, and runtime files all live under workspace/r3/.
  # ${PWD} expands to the dir process-compose is launched from (the repo root);
  # run it from there.
  server:
    command: bun run dev
    availability:
      restart: on_failure
    environment:
      - "FORCE_COLOR=1"
      - "R3_PORT=8891"
      - "XDG_STATE_HOME=${PWD}/workspace"
      - "XDG_RUNTIME_DIR=${PWD}/workspace"
      - "XDG_CONFIG_HOME=${PWD}/workspace"
